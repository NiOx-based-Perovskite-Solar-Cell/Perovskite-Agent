# Deploy on a VPS (no dev reload, no debugger, the SI agent's Chrome on the server):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Naming both files stops docker-compose.override.yml (dev mode) from loading.
# Needs in .env: AGENT_SERVER_TOKEN (see .env.example).
services:
  psc:
    restart: unless-stopped
    ports: !override ["5000:5000"]
    environment:
      AGENT_SERVER_URL: http://agent:5100
      AGENT_BROWSER_URL: ${AGENT_BROWSER_URL:-/browser/vnc.html?path=browser/websockify&autoconnect=1&resize=scale}
  agent:
    build: {context: ., dockerfile: Dockerfile.agent}
    image: psc-agent-chrome:1.0
    restart: unless-stopped
    ports: ["6080:6080"]
    env_file: [.env]   # OPENROUTER_API_KEY and AGENT_SERVER_TOKEN
    shm_size: 1gb      # Chrome crashes with Docker's 64 MB /dev/shm
    volumes:
      - "./original paper:/data/original paper"   # SI is saved in SI/, where the web app reads it
      - "chrome-profile:/profile"                 # the sign-in survives restarts
volumes:
  chrome-profile:
