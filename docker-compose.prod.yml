# Deploy for testers (no dev reload, no debugger, login in front, the SI agent's Chrome on the server):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Naming both files stops docker-compose.override.yml (dev mode) from loading.
# Needs in .env: BASIC_USER, BASIC_HASH, AGENT_SERVER_TOKEN; optional SITE_ADDRESS, BROWSER_USER/BROWSER_HASH (see .env.example).
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      BASIC_USER: ${BASIC_USER:?set BASIC_USER in .env}
      BASIC_HASH: ${BASIC_HASH:?set BASIC_HASH in .env}
      # the agent's Chrome is signed in as you: set BROWSER_* to keep it from testers (default: the same login)
      BROWSER_USER: ${BROWSER_USER:-${BASIC_USER}}
      BROWSER_HASH: ${BROWSER_HASH:-${BASIC_HASH}}
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "caddy-data:/data"
    depends_on: [psc, agent]
  psc:
    restart: unless-stopped
    environment:
      AGENT_SERVER_URL: http://agent:5100
      AGENT_BROWSER_URL: /browser/vnc.html?path=browser/websockify&autoconnect=1&resize=scale
  agent:
    build: {context: ., dockerfile: Dockerfile.agent}
    image: psc-agent-chrome:1.0
    restart: unless-stopped
    env_file: [.env]   # OPENROUTER_API_KEY and AGENT_SERVER_TOKEN
    shm_size: 1gb      # Chrome crashes with Docker's 64 MB /dev/shm
    volumes:
      - "./original paper:/data/original paper"   # SI is saved in SI/, where the web app reads it
      - "chrome-profile:/profile"                 # the sign-in survives restarts
volumes:
  caddy-data:
  chrome-profile:
