<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check extracted tables</title>
  <style>
    :root {
      --bg:#f8fafc; --card:#fff; --ink:#0f172a; --mute:#64748b; --line:#e2e8f0; --accent:#4338ca; --accent-soft:#eef2ff;
      --pill-on-bg:#1e293b; --pill-on-ink:#ffffff; --pill-on-line:#1e293b;
      --accept:#d1fae5; --accept-t:#065f46; --more:#fef3c7; --more-t:#92400e; --rev:#ffe4e6; --rev-t:#9f1239; --hr:#ede9fe; --hr-t:#5b21b6;
      --row-hover:#f8fafc; --row-sel:#eef2ff; --row-checked:#f8fafc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0f172a; --card:#1e293b; --ink:#e2e8f0; --mute:#94a3b8; --line:#334155; --accent:#a5b4fc; --accent-soft:#1e1b4b;
        --pill-on-bg:#e2e8f0; --pill-on-ink:#0f172a; --pill-on-line:#e2e8f0;
        --accept:#064e3b; --accept-t:#a7f3d0; --more:#78350f; --more-t:#fde68a; --rev:#881337; --rev-t:#fecdd3; --hr:#4c1d95; --hr-t:#ddd6fe;
        --row-hover:#162032; --row-sel:#1e294b; --row-checked:#141c2b;
      }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.45 system-ui, -apple-system, sans-serif; height:100vh; display:flex; flex-direction:column; }
    header { padding:.65rem 1.1rem; border-bottom:1px solid var(--line); background:var(--card); display:flex; gap:.8rem; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .head-left { display:flex; align-items:baseline; gap:.8rem; flex-wrap:wrap; }
    header h1 { font-size:1rem; margin:0; font-weight:700; }
    .mute { color:var(--mute); font-size:.78rem; }
    .head-actions { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }
    .btn { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:.45rem; padding:.28rem .65rem; font-size:.76rem; font-weight:500; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:.3rem; outline:none; }
    .btn:hover { border-color:var(--mute); }
    .btn:focus, .btn:focus-visible { outline:none; }
    .btn-primary { background:var(--pill-on-bg); color:var(--pill-on-ink); border-color:var(--pill-on-line); }
    .btn-primary:hover { opacity:.9; }
    #toolbar { padding:.55rem 1.1rem; border-bottom:1px solid var(--line); background:var(--card); display:flex; flex-direction:column; gap:.45rem; }
    .bar-row { display:flex; flex-wrap:wrap; gap:.45rem; align-items:center; justify-content:space-between; }
    .bar-group { display:flex; flex-wrap:wrap; gap:.35rem; align-items:center; }
    input[type="search"], select { padding:.3rem .55rem; border:1px solid var(--line); border-radius:.45rem; background:var(--bg); color:var(--ink); font-size:.78rem; outline:none; }
    input[type="search"] { width:min(22rem, 100%); }
    button.chip, button.stab { border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:9999px; padding:.24rem .72rem; font-size:.75rem; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:.35rem; outline:none; }
    button.chip:hover, button.stab:hover { border-color:var(--mute); }
    button.chip:focus, button.chip:focus-visible, button.stab:focus, button.stab:focus-visible { outline:none; }
    button.chip.on, button.stab.on { border-color:var(--pill-on-line); background:var(--pill-on-bg); color:var(--pill-on-ink); font-weight:600; }
    .badge { display:inline-block; padding:.06rem .45rem; border-radius:9999px; font-size:.7rem; font-weight:600; white-space:nowrap; }
    .accept, .match { background:var(--accept); color:var(--accept-t); }
    .verify_more, .review { background:var(--more); color:var(--more-t); }
    .revise, .mismatch { background:var(--rev); color:var(--rev-t); }
    .human_read, .missing_in_record { background:var(--hr); color:var(--hr-t); }
    .unit_mismatch { background:#ffedd5; color:#9a3412; }
    .paper_more_detail { background:#ccfbf1; color:#115e59; }
    .not_found, .needs_si, .not_checked { background:var(--line); color:var(--mute); }

    main { flex:1; min-height:0; display:flex; }
    #tables-pane { flex:1; min-width:0; overflow:auto; padding:.9rem 1.1rem; display:block; }
    #tables-pane.single-sheet { display:flex; flex-direction:column; overflow:hidden; }
    .sheet-card { background:var(--card); border:1px solid var(--line); border-radius:.6rem; overflow:hidden; margin-bottom:1rem; }
    .sheet-card:last-child { margin-bottom:0; }
    #tables-pane.single-sheet .sheet-card { flex:1; min-height:0; display:flex; flex-direction:column; margin-bottom:0; }
    .sheet-head { padding:.55rem .85rem; border-bottom:1px solid var(--line); background:var(--bg); display:flex; align-items:center; justify-content:space-between; gap:.5rem; flex-shrink:0; }
    .sheet-head h2 { margin:0; font-size:.88rem; font-weight:700; }
    .sheet-scroll { overflow-x:auto; max-height:28rem; overflow-y:auto; }
    #tables-pane.single-sheet .sheet-scroll { flex:1; min-height:0; max-height:none; overflow:auto; }
    table { width:100%; border-collapse:collapse; font-size:.78rem; }
    th { position:sticky; top:0; z-index:2; background:var(--bg); color:var(--mute); text-align:left; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:.45rem .6rem; border-bottom:1px solid var(--line); white-space:nowrap; }
    td { padding:.45rem .6rem; border-bottom:1px solid var(--line); vertical-align:top; min-width:4.5rem; max-width:20rem; word-break:break-word; }
    td.col-chk, th.col-chk { width:2.2rem; min-width:2.2rem; text-align:center; }
    td.col-act, th.col-act { width:6.5rem; min-width:6.5rem; white-space:nowrap; }
    tr:hover td { background:var(--row-hover); }
    tr.is-sel td { background:var(--row-sel); }
    tr.is-checked td { opacity:.62; }
    tr.attn-verify td:first-child { box-shadow:inset 3px 0 0 #d97706; }
    tr.attn-revise td:first-child { box-shadow:inset 3px 0 0 #dc2626; }
    tr.attn-human td:first-child { box-shadow:inset 3px 0 0 #7c3aed; }
    .num { font-variant-numeric:tabular-nums; }
    .empty-cell { color:var(--mute); opacity:.45; }
    .ev-quote { color:var(--ink); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    .ev-quote:hover { -webkit-line-clamp:unset; }

    #drawer { width:min(44vw, 46rem); border-left:1px solid var(--line); background:var(--card); display:flex; flex-direction:column; min-width:22rem; }
    #drawer[hidden] { display:none; }
    #d-top { padding:.6rem .85rem; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:.5rem; }
    #d-facts { padding:.65rem .85rem; border-bottom:1px solid var(--line); font-size:.8rem; max-height:36vh; overflow:auto; }
    #d-facts blockquote { margin:.45rem 0 0; padding:.4rem .65rem; border-left:3px solid var(--accent); background:var(--bg); font-size:.8rem; }
    #d-kv { width:100%; margin-top:.4rem; border:1px solid var(--line); border-radius:.4rem; overflow:hidden; }
    #d-kv th, #d-kv td { padding:.25rem .5rem; font-size:.76rem; position:static; }
    #d-pager { display:flex; flex-wrap:wrap; gap:.45rem; align-items:center; margin-top:.45rem; }
    #d-pagebox { flex:1; overflow:auto; background:var(--bg); padding:.75rem; }
    #d-page { position:relative; margin:0 auto; max-width:100%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.2); }
    #d-page img { display:block; width:100%; height:auto; }
    .hl { position:absolute; background:rgba(250,204,21,.38); outline:2px solid rgba(234,88,12,.85); border-radius:2px; pointer-events:none; }
    .hl.value { background:rgba(56,189,248,.3); outline-color:rgba(2,132,199,.85); }
    .found { color:#16a34a; font-weight:600; } .notfound { color:#dc2626; font-weight:600; } .weak { color:#0284c7; font-weight:600; }
    @media (max-width: 960px) {
      main { flex-direction:column; }
      #drawer { width:100%; height:48vh; border-left:0; border-top:1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <div class="head-left">
      <h1 id="title">Check extracted tables</h1>
      <span class="mute" id="meta">job {{ job_id }}</span>
      <span class="badge accept" id="checked-progress">Checked 0 / 0</span>
    </div>
    <div class="head-actions">
      <button type="button" class="btn" id="clear-checks">Clear checks</button>
      <a class="btn" id="csv-link" href="/api/jobs/{{ job_id }}/files/review.csv?download=1">Download CSV</a>
      <a class="btn" href="/review/{{ job_id }}" target="_blank" rel="noopener">Side-by-side PDF review ↗</a>
      <a class="btn" href="/#jobs/{{ job_id }}">← Back to Jobs</a>
    </div>
  </header>

  <section id="toolbar">
    <div class="bar-row">
      <div class="bar-group" id="sheet-tabs"></div>
      <div class="bar-group">
        <select id="device-filter" aria-label="Filter by device"></select>
        <input id="q" type="search" placeholder="Search values, device, evidence, reason…">
      </div>
    </div>
    <div class="bar-row">
      <div class="bar-group" id="decision-chips"></div>
      <span class="mute" id="shown-count"></span>
    </div>
  </section>

  <main>
    <section id="tables-pane"><p class="mute">Loading rows…</p></section>
    <aside id="drawer" hidden>
      <div id="d-top">
        <strong style="font-size:.85rem" id="d-title">Evidence in paper</strong>
        <div class="bar-group">
          <button type="button" class="btn btn-primary" id="d-mark-next">✓ Mark checked</button>
          <button type="button" class="btn" id="d-close" title="Close (Esc)">✕</button>
        </div>
      </div>
      <div id="d-facts"></div>
      <div id="d-pagebox" hidden><div id="d-page"><img id="d-pageimg" alt="the cited page"></div></div>
    </aside>
  </main>

  <script>
    window.TABLE_JOB = {{ job_id|tojson }};
    window.SHEET_HEADERS = {{ sheet_headers|tojson }};
  </script>
  <script src="{{ url_for('static', filename='table.js') }}"></script>
</body>
</html>
